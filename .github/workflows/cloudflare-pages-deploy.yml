name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    environment: github-cloudflare
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Check D1 configuration
        id: d1_check
        run: |
          if grep -q '\[\[d1_databases\]\]' wrangler.toml 2>/dev/null; then
            echo "has_d1=true" >> $GITHUB_OUTPUT
          else
            echo "has_d1=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve D1 database ID
        if: steps.d1_check.outputs.has_d1 == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_NAME=$(grep 'database_name' wrangler.toml | head -1 | cut -d'"' -f2)
          DB_ID=$(npx wrangler@4 d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database: $DB_NAME"
            npx wrangler@4 d1 create "$DB_NAME"
            DB_ID=$(npx wrangler@4 d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          fi
          echo "D1 database ID: $DB_ID"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          output=$(npx wrangler@4 pages project create peaha-web --production-branch=main 2>&1) && echo "Project created" || {
            if echo "$output" | grep -q "already exists"; then
              echo "Project peaha-web already exists, skipping"
            else
              echo "$output"
              exit 1
            fi
          }

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=peaha-web

      # After the deploy, so the database matches the code now live. The worker
      # then finds the checksum ready and never imports on a first request.
      - name: Import content into D1
        if: steps.d1_check.outputs.has_d1 == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SQL_DUMP=$(find dist -name "sql_dump.txt" | head -1)
          if [ -z "$SQL_DUMP" ]; then
            echo "sql_dump.txt not found in dist/"
            exit 1
          fi
          node scripts/d1-content-sql.mjs "$SQL_DUMP" content-import.sql
          npx wrangler@4 d1 execute DB --remote --file=content-import.sql
