name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    environment: cloudflare-pages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Resolve D1 database ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_ID="${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}"
          if [ -z "$DB_ID" ]; then
            DB_NAME=$(grep 'database_name' wrangler.toml | head -1 | cut -d'"' -f2)
            DB_ID=$(npx wrangler@4 d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
            if [ -z "$DB_ID" ]; then
              echo "Creating D1 database: $DB_NAME"
              DB_ID=$(npx wrangler@4 d1 create "$DB_NAME" --json | jq -r '.uuid')
            fi
          fi
          echo "D1 database ID: $DB_ID"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml

      - name: Migrate D1 content database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SQL_DUMP=$(find dist -name "sql_dump.txt" | head -1)
          if [ -z "$SQL_DUMP" ]; then
            echo "sql_dump.txt not found in dist/. Files in dist/:"
            find dist -type f | head -30
            exit 1
          fi
          echo "Found SQL dump at: $SQL_DUMP"
          BATCH=""
          BATCH_SIZE=0
          MAX_BATCH=50000
          while IFS= read -r line; do
            LINE_SIZE=${#line}
            if [ $((BATCH_SIZE + LINE_SIZE)) -gt $MAX_BATCH ] && [ -n "$BATCH" ]; then
              npx wrangler@4 d1 execute DB --remote --command="$BATCH"
              BATCH=""
              BATCH_SIZE=0
            fi
            BATCH="$BATCH$line"$'\n'
            BATCH_SIZE=$((BATCH_SIZE + LINE_SIZE))
          done < "$SQL_DUMP"
          if [ -n "$BATCH" ]; then
            npx wrangler@4 d1 execute DB --remote --command="$BATCH"
          fi

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          output=$(npx wrangler@4 pages project create p2pay-website --production-branch=main 2>&1) && echo "Project created" || {
            if echo "$output" | grep -q "already exists"; then
              echo "Project p2pay-website already exists, skipping"
            else
              echo "$output"
              exit 1
            fi
          }

      - name: Sync secrets to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WISE_API_TOKEN: ${{ secrets.WISE_API_TOKEN }}
        run: |
          printf '{"WISE_API_TOKEN":"%s"}' "$WISE_API_TOKEN" | \
            npx wrangler@4 pages secret bulk --project-name=p2pay-website

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=p2pay-website
