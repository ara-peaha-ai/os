name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    environment: github-cloudflare
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Patch worker nitro bundle
        run: |
          node -e "
          const fs=require('fs');
          const ni='dist/_worker.js/chunks/nitro/nitro.mjs';
          if(!fs.existsSync(ni)){console.log('nitro.mjs not found');process.exit(0);}
          let c=fs.readFileSync(ni,'utf8');
          const before=c;
          c=c.replace('Reflect.get(e,t,r):Reflect.get(_,t,r)','Reflect.get(e,t,r):Reflect.get(_,t,_)');
          if(c===before){console.log('nitro.mjs: proxy pattern not found, skipping');} else {fs.writeFileSync(ni,c);console.log('Patched nitro.mjs: fixed process proxy receiver');}
          const f='dist/_worker.js/index.js';
          if(!fs.existsSync(f)){console.log('index.js not found');process.exit(0);}
          let ci=fs.readFileSync(f,'utf8');
          ci=ci.replace('import\"node:process\"','import __np from\"node:process\";globalThis.process=globalThis.process||__np');
          fs.writeFileSync(f,ci);
          console.log('Patched index.js: node:process import');
          "

      - name: Check D1 configuration
        id: d1_check
        run: |
          if grep -q '\[\[d1_databases\]\]' wrangler.toml 2>/dev/null; then
            echo "has_d1=true" >> $GITHUB_OUTPUT
          else
            echo "has_d1=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve D1 database ID
        if: steps.d1_check.outputs.has_d1 == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_NAME=$(grep 'database_name' wrangler.toml | head -1 | cut -d'"' -f2)
          DB_ID=$(npx wrangler@4 d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          if [ -z "$DB_ID" ]; then
            echo "Creating D1 database: $DB_NAME"
            npx wrangler@4 d1 create "$DB_NAME"
            DB_ID=$(npx wrangler@4 d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          fi
          echo "D1 database ID: $DB_ID"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml

      - name: Migrate D1 content database
        if: steps.d1_check.outputs.has_d1 == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SQL_DUMP=$(find dist -name "sql_dump.txt" | head -1)
          if [ -z "$SQL_DUMP" ]; then
            echo "sql_dump.txt not found in dist/. Files in dist/:"
            find dist -type f | head -30
            exit 1
          fi
          echo "Found SQL dump at: $SQL_DUMP"
          BATCH=""
          BATCH_SIZE=0
          MAX_BATCH=50000
          while IFS= read -r line; do
            LINE_SIZE=${#line}
            if [ $((BATCH_SIZE + LINE_SIZE)) -gt $MAX_BATCH ] && [ -n "$BATCH" ]; then
              npx wrangler@4 d1 execute DB --remote --command="$BATCH"
              BATCH=""
              BATCH_SIZE=0
            fi
            BATCH="$BATCH$line"$'\n'
            BATCH_SIZE=$((BATCH_SIZE + LINE_SIZE))
          done < "$SQL_DUMP"
          if [ -n "$BATCH" ]; then
            npx wrangler@4 d1 execute DB --remote --command="$BATCH"
          fi

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          output=$(npx wrangler@4 pages project create p2pagos-website --production-branch=main 2>&1) && echo "Project created" || {
            if echo "$output" | grep -q "already exists"; then
              echo "Project p2pagos-website already exists, skipping"
            else
              echo "$output"
              exit 1
            fi
          }

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist --project-name=p2pagos-website --commit-dirty=true
