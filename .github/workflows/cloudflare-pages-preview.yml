name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Deploy PR Preview
    environment: github-cloudflare
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          NUXT_PUBLIC_IS_PREVIEW: 'true'

      - name: Patch worker nitro bundle
        run: |
          node -e "
          const fs=require('fs');
          const ni='dist/_worker.js/chunks/nitro/nitro.mjs';
          if(!fs.existsSync(ni)){console.log('nitro.mjs not found');process.exit(0);}
          let c=fs.readFileSync(ni,'utf8');
          const before=c;
          c=c.replace('Reflect.get(e,t,r):Reflect.get(_,t,r)','Reflect.get(e,t,r):Reflect.get(_,t,_)');
          if(c===before){console.log('nitro.mjs: proxy pattern not found, skipping');} else {fs.writeFileSync(ni,c);console.log('Patched nitro.mjs: fixed process proxy receiver');}
          const f='dist/_worker.js/index.js';
          if(!fs.existsSync(f)){console.log('index.js not found');process.exit(0);}
          let ci=fs.readFileSync(f,'utf8');
          ci=ci.replace('import\"node:process\"','import __np from\"node:process\";globalThis.process=globalThis.process||__np');
          fs.writeFileSync(f,ci);
          console.log('Patched index.js: node:process import');
          "

      - name: Resolve D1 database ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_NAME=$(grep 'database_name' wrangler.toml | head -1 | cut -d'"' -f2)
          DB_ID=$(npx wrangler@4 d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          if [ -z "$DB_ID" ]; then
            echo "D1 database '$DB_NAME' not found — run production deploy first"
            exit 1
          fi
          echo "D1 database ID: $DB_ID"
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DB_ID/" wrangler.toml

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist --project-name=p2pagos-website --branch=pr-${{ github.event.number }} --commit-dirty=true

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cf-preview -->'
            const url = `https://pr-${{ github.event.number }}.p2pay-website.pages.dev`
            const body = `${marker}\n🔍 **Preview:** ${url}`
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find(c => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
