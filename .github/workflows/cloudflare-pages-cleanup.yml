name: Cleanup PR Preview

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    name: Delete Cloudflare Pages preview deployment
    environment: github-cloudflare
    permissions:
      contents: read

    steps:
      - name: Delete preview deployments for branch pr-${{ github.event.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BRANCH="pr-${{ github.event.number }}"
          PROJECT="p2pagos-website"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}/deployments"

          PAGE=1
          while true; do
            RESPONSE=$(curl -s -X GET "${API}?per_page=25&page=${PAGE}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json")

            IDS=$(echo "$RESPONSE" | jq -r --arg b "$BRANCH" \
              '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id')

            if [ -z "$IDS" ]; then
              break
            fi

            for ID in $IDS; do
              echo "Deleting deployment $ID (branch $BRANCH)"
              curl -s -X DELETE "${API}/${ID}?force=true" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json" | jq '.success'
            done

            TOTAL=$(echo "$RESPONSE" | jq '.result | length')
            if [ "$TOTAL" -lt 25 ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          echo "Cleanup complete for branch $BRANCH"
